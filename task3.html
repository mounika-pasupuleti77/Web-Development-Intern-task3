<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Joke Generator</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      background: linear-gradient(135deg, #ffffff, #ffe4ec); /* Added color inside box */
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 450px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      margin-bottom: 20px;
      color: #ff4b2b;
      font-size: 28px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    #joke {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.6;
      color: #444;
      min-height: 100px;
    }

    button {
      background: linear-gradient(to right, #ff4b2b, #ff416c);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(255, 65, 108, 0.3);
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.5);
    }

    footer {
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😂 Random Joke Generator</h1>
    <p id="joke">Click the button to get a joke!</p>
    <button onclick="getJoke()">Get Joke</button>
    <footer>Powered by Official Joke API</footer>
  </div>

  <script>
    async function getJoke() {
      const response = await fetch("https://official-joke-api.appspot.com/random_joke");
      const data = await response.json();
      document.getElementById("joke").innerHTML = `
        <b>${data.setup}</b><br><br>👉 ${data.punchline}
      `;
    }
  </script>
</body>
</html>
